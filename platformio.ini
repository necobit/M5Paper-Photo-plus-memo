; M5Paper (初代 / ESP32) 写真+メモアプリ
[env:m5paper]
platform = espressif32@6.10.0
; espressif32@6.10.0 には m5stack_paper 定義が無いため、同じ 16MB Flash + PSRAM 構成の FIRE を流用
; （ボード判定は M5Unified が実行時に自動で行う）
board = m5stack-fire
framework = arduino
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
upload_speed = 460800
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
build_flags =
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    m5stack/M5Unified@^0.2.25
