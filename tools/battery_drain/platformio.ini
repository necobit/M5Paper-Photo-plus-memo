; 電池の 0% 電圧を測るための消費加速テスト。本体アプリとは別に書き込む
; パーティション表は本体と共通なので、LittleFS の写真・メモは消えない
[env:m5paper]
platform = espressif32@6.10.0
board = m5stack-fire
framework = arduino
board_build.partitions = ../../partitions.csv
board_build.filesystem = littlefs
upload_speed = 460800
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
build_flags =
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    m5stack/M5Unified@^0.2.25
